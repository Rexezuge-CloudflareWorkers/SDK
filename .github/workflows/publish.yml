name: Publish

permissions:
  contents: read
  id-token: write # npm provenance attestation, OIDC — no stored token needed for the publish itself

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    name: Publish @rexezuge/* To npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm And Node
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm -r --if-present exec tsc -p tsconfig.json

      - name: Test
        run: pnpm -r --if-present test

      - name: Publish
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
