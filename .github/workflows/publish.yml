name: Publish

permissions:
  contents: read
  id-token: write

on:
  # Gated on CI rather than on the push itself: `workflow_run` starts this
  # workflow only after the Continuous Integration run for `main` has finished,
  # and the job's `if:` refuses to run unless that run succeeded. GitHub has no
  # cross-workflow `needs:`; this is the idiom the family's deploy workflow
  # already uses for the same reason.
  workflow_run:
    workflows:
      - Continuous Integration
    branches:
      - main
    types:
      - completed
  # Escape hatch: publish by hand after fixing a failed CI run.
  workflow_dispatch:

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # `workflow_run` fires for failed and cancelled runs too, and those must not
    # reach npm.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # A `workflow_run` checkout lands on main's tip, which is not
          # necessarily the commit CI just cleared. Pinning to head_sha publishes
          # the tree that passed.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm And Node
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm Trusted Publishing Support
        # pnpm publish shells out to the system npm CLI, so this is the version that matters.
        # Trusted publishing requires npm >= 11.5.1 and Node >= 22.14.0.
        run: |
          node --version
          npm --version
          node -e "const [major, minor] = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) { console.error('npm >= 11.5.1 required for trusted publishing'); process.exit(1); }"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # Kept, unlike the test step this workflow used to run: `dist/` is the
      # artifact being published, and cross-package imports resolve into it. CI
      # already ran the suite against this exact SHA.
      - name: Build
        run: pnpm -r --if-present build

      # Trusted publishing: no NODE_AUTH_TOKEN. The changesets publish step
      # shells out to the system npm CLI, so the npm CLI exchanges the GitHub
      # OIDC token automatically, and provenance is generated by default — no
      # --provenance flag needed. Requires a Trusted Publisher (organization
      # Rexezuge-CloudflareWorkers, repository SDK, workflow publish.yml) on
      # each @rexezuge/* package at npmjs.com.
      #
      # The OIDC `job_workflow_ref` claim comes from GITHUB_WORKFLOW_REF, and a
      # `workflow_run`-triggered workflow still runs the default-branch copy of
      # this file — so the claim is unchanged by the trigger swap. Verified on the
      # first release after it landed; the step below prints it either way.
      #
      # Versions must be bumped first: merge PRs carrying changeset files, then
      # merge the automated CHORE: Version Packages vX.Y.Z PR. Publishing the same
      # version twice is a no-op — npm already has it.
      - name: Show Trusted Publisher Claims
        # npm matches the OIDC job_workflow_ref claim against the Trusted
        # Publisher entry on each package. If publish fails with E403 OIDC
        # permission denied, compare these exact values against npmjs.com ->
        # package Settings -> Trusted Publisher (case-sensitive, no
        # environment).
        run: |
          echo "repository=${{ github.repository }}"
          echo "workflow_ref=${{ github.workflow_ref }}"
      - name: Publish
        run: pnpm changeset publish
