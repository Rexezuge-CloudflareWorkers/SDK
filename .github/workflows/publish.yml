name: Publish

permissions:
  contents: read
  id-token: write

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm And Node
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify npm Trusted Publishing Support
        # pnpm publish shells out to the system npm CLI, so this is the version that matters.
        # Trusted publishing requires npm >= 11.5.1 and Node >= 22.14.0.
        run: |
          node --version
          npm --version
          node -e "const [major, minor] = require('child_process').execSync('npm --version').toString().trim().split('.').map(Number); if (major < 11 || (major === 11 && minor < 5)) { console.error('npm >= 11.5.1 required for trusted publishing'); process.exit(1); }"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm -r --if-present build

      - name: Test
        run: pnpm -r --if-present test

      # Trusted publishing: no NODE_AUTH_TOKEN. The npm CLI exchanges the GitHub
      # OIDC token automatically, and provenance is generated by default — no
      # --provenance flag needed. Requires a Trusted Publisher (organization
      # Rexezuge-CloudflareWorkers, repository SDK, workflow publish.yml) on
      # each @rexezuge/* package at npmjs.com.
      - name: Publish
        run: pnpm -r publish --access public --no-git-checks
