name: Continuous Integration

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Kit Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build
        run: pnpm -r --if-present exec tsc -p tsconfig.json

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Test
        run: pnpm -r --if-present test

  consumer-matrix:
    name: Consumer ${{ matrix.consumer }}
    runs-on: ubuntu-latest
    # The gate that makes a published kit version safe: every consumer repo that
    # has adopted the kit is cloned, its kit deps re-pointed at this PR's HEAD
    # (link:), and its own gates run. A consumer with no @rexezuge/* deps is
    # skipped — adoption is what enrolls a repo here.
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - AWS-AccessBridge
          - CalDAV-Bridge
          - ChordDHT-Tracker
          - Durable-DAV
          - Durable-DAV-Router
          - Edge-Git
          - Edge-Sonic
          - Mail-Meow
          - Mail-Otter
          - Records-Provider
          - TOTP-Generator

    steps:
      - name: Checkout Kit
        uses: actions/checkout@v6
        with:
          path: kit

      - name: Checkout Consumer
        uses: actions/checkout@v6
        with:
          repository: Rexezuge-CloudflareWorkers/${{ matrix.consumer }}
          path: consumer

      - name: Setup Environment
        uses: ./kit/.github/actions/setup-env
        with:
          working-directory: consumer

      - name: Point Kit Deps At This Commit
        working-directory: consumer
        run: |
          node "$GITHUB_WORKSPACE/kit/scripts/relink-consumer.mjs" \
            --kit "$GITHUB_WORKSPACE/kit" \
            --consumer "$GITHUB_WORKSPACE/consumer"

      - name: Install
        working-directory: consumer
        run: pnpm install --no-frozen-lockfile

      - name: Consumer Gates
        working-directory: consumer
        run: |
          if grep -q '"@rexezuge/' package.json packages/*/package.json apps/*/package.json 2>/dev/null; then
            pnpm -r typecheck
            pnpm run test
          else
            echo "::notice::${{ matrix.consumer }} has not adopted the kit — skipping gates."
          fi
