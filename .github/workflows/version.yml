name: Version Packages

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm And Node
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Create Version Pull Request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm version-packages
          commit: 'CHORE: Version Packages'
          title: 'CHORE: Version Packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Include Version In Pull Request Title
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: |
          VERSION=$(node -p "require('./packages/errors/package.json').version")
          gh pr edit "${{ steps.changesets.outputs.pullRequestNumber }}" --title "CHORE: Version Packages v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Close Superseded Version Pull Requests
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: |
          CURRENT="${{ steps.changesets.outputs.pullRequestNumber }}"
          VERSION=$(node -p "require('./packages/errors/package.json').version")
          gh pr list --state open --limit 100 --json number,title --jq '.[] | select(.title | startswith("CHORE: Version Packages")) | .number' | while read -r NUMBER; do
            if [ "$NUMBER" != "$CURRENT" ]; then
              gh pr close "$NUMBER" --comment "Superseded by #$CURRENT (v$VERSION)." --delete-branch
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
