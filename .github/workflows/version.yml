name: Version Packages

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - main

# Version runs race when several pushes to main land close together (a version
# PR merge followed by a feature merge): serialize them so two runs never open
# competing `changeset-release/main` pull requests.
concurrency:
  group: version-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup pnpm And Node
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Check For Releasable Changesets
        id: check
        run: |
          # `status --output` exits non-zero when the release plan itself is
          # broken (e.g. a changeset mixing ignored and releasable packages),
          # which must stay loud. An empty `releases` list means nothing
          # releasable is pending (only ignored/private changesets, or none at
          # all): skip the version PR so the action never pushes an empty
          # branch and fails PR creation with "No commits between main and
          # changeset-release/main".
          pnpm changeset status --output "$RUNNER_TEMP/changeset-status.json"
          HAS_RELEASABLE=$(node -e "console.log(require(process.env.RUNNER_TEMP + '/changeset-status.json').releases.length > 0 ? 'true' : 'false')")
          echo "has_releasable=$HAS_RELEASABLE" >> "$GITHUB_OUTPUT"

      - name: Create Version Pull Request
        id: changesets
        if: steps.check.outputs.has_releasable == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm version-packages
          commit: 'CHORE: Version Packages'
          title: 'CHORE: Version Packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Include Version In Pull Request Title
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: |
          VERSION=$(node -p "require('./packages/errors/package.json').version")
          gh pr edit "${{ steps.changesets.outputs.pullRequestNumber }}" --title "CHORE: Version Packages v$VERSION"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Include Version In Commit Message
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin changeset-release/main
          git checkout -B changeset-release/main FETCH_HEAD
          VERSION=$(node -p "require('./packages/errors/package.json').version")
          MSG="CHORE: Version Packages v$VERSION"
          CURRENT=$(git log -1 --format=%s)
          if [ "$CURRENT" != "$MSG" ]; then
            git commit --amend -m "$MSG"
            git push --force-with-lease origin changeset-release/main
          fi

      - name: Close Superseded Version Pull Requests
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: |
          CURRENT="${{ steps.changesets.outputs.pullRequestNumber }}"
          VERSION=$(node -p "require('./packages/errors/package.json').version")
          gh pr list --state open --limit 100 --json number,title --jq '.[] | select(.title | startswith("CHORE: Version Packages")) | .number' | while read -r NUMBER; do
            if [ "$NUMBER" != "$CURRENT" ]; then
              gh pr close "$NUMBER" --comment "Superseded by #$CURRENT (v$VERSION)." --delete-branch
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
