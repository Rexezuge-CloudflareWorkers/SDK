name: Continuous Integration

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The formatting gate, and the only job here that consumes no build output:
  # Prettier reads source, and `.prettierignore` keeps it out of `dist/`. It runs
  # independently of `build`, so a formatting-only fix never waits on a build and
  # a broken build never hides a formatting problem.
  #
  # `format:check` is the enforceable half. `format` repairs, and a repair that
  # passes is a repair whose diff the runner throws away with the checkout — this
  # is the same trap `eslint --fix --quiet` sets, where `--quiet` additionally
  # discards warnings so the gate has never run.
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Check Formatting
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run format:check
          max_attempts: '2'

  # One job per gate, rather than one `checks` job running all of them in
  # sequence. A failure names the gate that broke instead of arriving three
  # steps deep in a log, and a re-run re-runs only that half.
  #
  # `typecheck`, `lint` and `test` consume `build`'s output rather than
  # producing their own. Cross-package imports resolve through the workspace
  # symlinks in `node_modules` to `dist/` — `tsconfig.base.json` declares no
  # `paths` and every package's `exports` points at `./dist/index.js` — so a
  # fresh checkout with no `dist/` cannot resolve `@rexezuge/errors`, and
  # cannot resolve any package that depends on it. The lint gate needs it too:
  # `eslint.config.mjs` imports the factory from `@rexezuge/tooling`'s built
  # output. `build` publishes the nine `dist/` directories as one artifact and
  # the other three restore it, which is what lets the gates run in parallel
  # instead of serially.
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build
        uses: ./.github/actions/retry-step
        with:
          command: pnpm -r --if-present build
          max_attempts: '2'

      - name: Upload Build Output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          # Roots the archive at the least common ancestor of the matched paths,
          # which is `packages/`, so entries land as `<package>/dist/...`.
          # `if-no-files-found: error` turns "the build emitted nothing" into a
          # failure here rather than an unresolved-import error in `typecheck`.
          path: |
            packages/*/dist/
          if-no-files-found: error
          retention-days: 7

  typecheck:
    name: Typecheck
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: dist
          # Restores each directory to `packages/<package>/dist/` — the layout the
          # node_modules symlinks and every package's `exports` expect. Downloaded
          # after `setup-env` so `pnpm install` cannot prune the restored tree.
          path: packages

      - name: Run Typecheck
        uses: ./.github/actions/retry-step
        with:
          command: pnpm -r --if-present typecheck
          max_attempts: '2'

  # The lint gate, converged from AWS-AccessBridge's `eslint.config.mjs` through
  # the kit's own factory: `eslint.config.mjs` is `defineRepoLintConfig` with
  # `scope: '@rexezuge'` plus the kit's dependency boundaries as `extraLayers`.
  #
  # `lint:check` is the enforceable half. `lint` repairs, and a repair that
  # passes is a repair whose diff the runner throws away with the checkout —
  # the same reason the `format` job runs `format:check`.
  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: dist
          # The lint config itself imports `@rexezuge/tooling`'s factory from
          # its built output, so this job restores `dist/` exactly as
          # `typecheck` does. Downloaded after `setup-env` so `pnpm install`
          # cannot prune the restored tree.
          path: packages

      - name: Run Lint
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run lint:check
          max_attempts: '2'

  # "Unit Tests" because every test in this job is one: the suite is hermetic —
  # `environment: 'node'`, no setup files, no service containers, and every
  # `fetch` in it is a hand-written stub or an in-process `Request`. It is also
  # the family's vocabulary (`unit-tests` in the sibling repos), and it reserves
  # the contrasting name for a workerd/Miniflare suite if one is ever added.
  #
  # The job key stays `test`, so it still greps against the script it runs.
  #
  # Note that `packages/tooling/src/test/integration-migrations.test.ts` runs
  # *here* despite its filename: it drives the migration helper against a
  # hand-written `D1DatabaseLike` and temp directories, so it is a unit test. The
  # name is inherited from the consumer repos whose integration suites use that
  # helper. Nothing excludes the file, and nothing should — that combination of
  # job name and filename is exactly what would otherwise invite someone to
  # "fix" it by excluding it.
  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Run Unit Tests
        uses: ./.github/actions/retry-step
        with:
          command: pnpm -r --if-present test
          max_attempts: '2'
